name: Bug report
description: Something went wrong with a device, a reading or sync
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Both]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and OS version
      placeholder: Pixel 9, Android 17
    validations:
      required: true
  - type: input
    id: sensor
    attributes:
      label: Bluetooth device
      placeholder: Chest strap or cuff model
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: payload
    attributes:
      label: Raw payload, if it's a parsing problem
      description: The hex shown in the log or the payloadHex field. Add it to spec/reference.py as a new vector.
