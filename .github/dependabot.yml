version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
  - package-ecosystem: swift
    directory: /ios/PulseLogCore
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /firebase
    schedule:
      interval: weekly
    groups:
      firebase:
        patterns: ["firebase*", "@firebase/*"]
