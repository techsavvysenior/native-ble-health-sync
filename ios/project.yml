# Generate the Xcode project with XcodeGen (brew install xcodegen), then open PulseLog.xcodeproj:
#   cd ios && xcodegen generate
name: PulseLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PulseLogCore:
    path: PulseLogCore
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.2.0

targets:
  PulseLog:
    type: application
    platform: iOS
    sources:
      - App
    configFiles:
      Debug: Support/App.xcconfig
      Release: Support/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pulselog
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Pulse Log
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: Pulse Log connects to your heart rate monitor or blood pressure cuff to record readings.
        # Keeps the connection and lets iOS relaunch the app for readings in the background (UC-12).
        UIBackgroundModes:
          - bluetooth-central
        # Optional Firebase project, filled from Support/Secrets.xcconfig. Blank means local-only.
        PulseLogFirebaseProjectID: $(PULSELOG_FIREBASE_PROJECT_ID)
        PulseLogFirebaseAppID: $(PULSELOG_FIREBASE_APP_ID)
        PulseLogFirebaseAPIKey: $(PULSELOG_FIREBASE_API_KEY)
        PulseLogFirebaseSenderID: $(PULSELOG_FIREBASE_SENDER_ID)
    dependencies:
      - package: PulseLogCore
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    scheme:
      gatherCoverageData: false
